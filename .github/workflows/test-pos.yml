name: POS Tests

on:
  push:
    branches: [main]
    paths:
      - 'pos/**'
  pull_request:
    branches: [main]
    paths:
      - 'pos/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pos

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pos/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Restore dev index.html
        run: |
          if [ -f index.html.source ]; then
            cp index.html.source index.html
          fi

      - name: Run E2E tests
        run: npx playwright test --reporter=list

      - name: Upload Playwright report on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: pos/playwright-report/
          retention-days: 7

      - name: Upload test screenshots on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: pos/test-results/
          retention-days: 7
