name: Auto-Backup Menu Data

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:          # manual trigger anytime

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch current menu from API
        run: |
          curl -sf https://fufut-api.fufutcoffee.workers.dev/api/menus \
            --retry 3 --retry-delay 5 \
            -o menu_backup.json
          echo "Fetched at $(date -u)" > menu_backup_log.txt
          echo "Items: $(node -e 'const m=require("./menu_backup.json"); console.log(m.categories.reduce((s,c)=>s+(c.items||[]).length,0))') across $(node -e 'const m=require("./menu_backup.json"); console.log(m.categories.length)') categories" >> menu_backup_log.txt
          cat menu_backup_log.txt

      - name: Commit backup to repo
        run: |
          git config user.name "menu-backup-bot"
          git config user.email "bot@fufutcoffee.com"
          git add menu_backup.json menu_backup_log.txt
          git diff --cached --quiet && echo "No changes to backup" || (git commit -m "auto: menu backup $(date -u +%Y-%m-%d\ %H:%M\ UTC) [skip ci]" && git push)

