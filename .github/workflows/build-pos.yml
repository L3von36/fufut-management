name: Build & Deploy All Apps

on:
  push:
    branches: [master]
  workflow_dispatch:

# Required so the build-pos job can commit the freshly built assets back to
# the repo (the "Commit built assets back" step). Without this, the default
# GITHUB_TOKEN is read-only and `git push` fails with HTTP 403.
permissions:
  contents: write

jobs:
  test-pos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: pos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: pos/package-lock.json
      - run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Restore dev index.html
        run: |
          if [ -f index.html.source ]; then
            cp index.html.source index.html
          fi
      - name: Run E2E tests
        env:
          VITE_API_URL: https://fufut-api.fufutcoffee.workers.dev
        run: npx playwright test --reporter=list

  build-admin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json
      - run: cd admin && npm ci
      - run: cp admin/index.html.source admin/index.html
      - name: Build Admin
        env:
          VITE_API_URL: ${{ vars.API_BASE_URL }}
        run: cd admin && npx vite build --base /
      - name: Bundle Pages Functions
        run: |
          if [ -d admin/functions ]; then
            cp -r admin/functions admin/dist/functions
          fi
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: admin
          command: pages deploy dist --project-name=fufut-admin --branch=main --commit-dirty=true --skip-caching

  build-pos:
    runs-on: ubuntu-latest
    needs: test-pos
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: pos/package-lock.json
      - run: cd pos && npm ci
      - run: |
          if [ -f pos/index.html.source ]; then
            cp pos/index.html.source pos/index.html
          fi
      - name: Build POS
        env:
          VITE_API_URL: ${{ vars.API_BASE_URL }}
        run: cd pos && npx vite build --base /
      - name: Bundle Pages Functions
        run: |
          if [ -d pos/functions ]; then
            cp -r pos/functions pos/dist/functions
          fi
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: pos
          command: pages deploy dist --project-name=fufut-pos --branch=main --commit-dirty=true --skip-caching
      - name: Commit built assets back
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rm -rf pos/assets
          cp -r pos/dist/assets pos/assets
          cp pos/dist/index.html pos/index.html.built
          cp pos/dist/index.html pos/index.html
          rm -rf pos/dist
          git add pos/index.html pos/index.html.built pos/assets/ || true
          git diff --cached --quiet || git commit -m "build: auto-build POS [skip ci]" --no-verify
          git push || true

  # Browser coverage for the table screens — written, committed, and NOT yet
  # passing. The app does not render at the URL the fixture navigates to, so
  # every test times out waiting for a table.
  #
  # Kept out of the deploy path deliberately, and bounded twice: the step gets
  # six minutes and the job eight, so a hang costs a red informational job and
  # nothing else. It does not gate anything because it has never been green — a
  # check that is red on arrival teaches people to ignore red, which costs more
  # than the check is worth. The jsdom suite in backoffice/tests/unit covers the
  # same behaviour and DOES gate the deploy.
  #
  # It cannot be debugged locally: Playwright registers no test file on the
  # maintainer's Windows machine, including the POS suite that passes on this
  # runner. Run `npm run test:e2e` where Playwright works, fix the navigation,
  # then make this job gate build-backoffice and delete this comment.
  e2e-backoffice:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backoffice/package-lock.json
      - run: cd backoffice && npm ci
      - name: Install Playwright browser
        run: cd backoffice && npx playwright install --with-deps chromium
        continue-on-error: true
      - name: E2E Backoffice (not yet passing — informational)
        run: cd backoffice && npx playwright test --reporter=list
        timeout-minutes: 6
        continue-on-error: true

  build-backoffice:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backoffice/package-lock.json
      - run: cd backoffice && npm ci
      # Gates the deploy, exactly as test-pos gates build-pos. The backoffice
      # had no suite at all until the HR screens were added, which is how
      # AuditLogView shipped calling a 404 endpoint and rendering an empty table
      # that looked like a quiet day.
      - name: Test Backoffice
        run: cd backoffice && npm test
      # The browser suite used to run here, marked informational with
      # continue-on-error. That ignores a FAILING step, not a SLOW one: every
      # test times out waiting for a table, the step ran for ten minutes, the
      # job hit its timeout, and the build and deploy below were skipped. The
      # run reported "cancelled" rather than "failed", so it did not even look
      # like a broken deploy — it looked like nothing happened.
      #
      # It now lives in its own job (e2e-backoffice) where it cannot take the
      # deploy with it, whatever it does. An informational check has no business
      # sharing a job with a deploy.
      - run: cp backoffice/index.html.source backoffice/index.html
      - name: Build Backoffice
        env:
          VITE_API_URL: ${{ vars.API_BASE_URL }}
        run: cd backoffice && npx vite build --base /
      - name: Bundle Pages Functions
        run: |
          if [ -d backoffice/functions ]; then
            cp -r backoffice/functions backoffice/dist/functions
          fi
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: backoffice
          command: pages deploy dist --project-name=fufut-backoffice --branch=main --commit-dirty=true --skip-caching
