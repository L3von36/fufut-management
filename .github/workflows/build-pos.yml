name: Build & Deploy All Apps

on:
  push:
    branches: [master]
  workflow_dispatch:

# Action versions are the Node 24-based majors (checkout/setup-node v5, cache v6,
# wrangler-action v4): GitHub deprecates Node 20-targeting actions and now only
# warns while force-running them on Node 24. Pinning the current majors stops
# the warning from ageing into a hard failure.

# Required so the build-pos job can commit the freshly built assets back to
# the repo (the "Commit built assets back" step). Without this, the default
# GITHUB_TOKEN is read-only and `git push` fails with HTTP 403.
permissions:
  contents: write

jobs:
  test-pos:
    runs-on: ubuntu-latest
    # Raised from 10, which this job outgrew: npm ci, 292 unit tests, a
    # browser download and the E2E suite no longer fit. It was killed part way
    # through installing Chromium, which skipped the build and deploy after it
    # and reported the run as cancelled rather than failed — so the POS quietly
    # did not ship and nothing looked broken.
    #
    # A gate that runs out of time is indistinguishable from one that passed
    # nothing, so give it room and let a genuine failure be the thing that
    # stops a deploy.
    timeout-minutes: 25
    defaults:
      run:
        working-directory: pos
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: pos/package-lock.json
      - run: npm ci
      - name: Run unit tests
        run: npm test
        timeout-minutes: 10
      # The browser download is by far the slowest thing in this workflow —
      # measured at 287s on one job and 492s on another in the same run, which
      # is what pushed test-pos past its timeout and stopped the POS deploying.
      # Caching it removes the download; --with-deps still runs apt, which is
      # the remaining variance.
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pos/package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-
      # NOT --with-deps. That runs apt-get, and apt is the entire cost here:
      # a run today spent twelve minutes retrying azure.archive.ubuntu.com
      # before timing out, in both jobs, having downloaded no browser at all.
      # The GitHub-hosted runner already carries Chromium's libraries; this
      # step now only fetches the browser, which the cache above usually makes
      # instant.
      #
      # If a library ever is missing, the E2E run fails naming it — a loud,
      # diagnosable failure rather than a quarter of an hour of apt retries.
      - name: Install Playwright browsers
        run: npx playwright install chromium
        timeout-minutes: 6
      - name: Restore dev index.html
        run: |
          if [ -f index.html.source ]; then
            cp index.html.source index.html
          fi
      - name: Run E2E tests
        env:
          VITE_API_URL: https://fufut-api.fufutcoffee.workers.dev
        run: npx playwright test --reporter=list
        # Inside the job's budget, so a hanging suite fails as a step rather
        # than cancelling the job — a cancelled job takes the deploy with it.
        timeout-minutes: 10

  build-admin:
    runs-on: ubuntu-latest
    # 25, not the 10 it was born with: the admin build is small, but npm ci plus
    # a cold upload to Pages has run past ten minutes twice now — once killed at
    # exactly 10m01s with the timeout annotation, once cancelled mid-run. A job
    # killed at the ceiling reports a timeout, not the step that was slow, so
    # give it the same room test-pos and e2e-backoffice get and let a genuine
    # failure name itself.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json
      - run: cd admin && npm ci
      - run: cp admin/index.html.source admin/index.html
      - name: Build Admin
        env:
          VITE_API_URL: ${{ vars.API_BASE_URL }}
        run: cd admin && npx vite build --base /
      - name: Bundle Pages Functions
        run: |
          if [ -d admin/functions ]; then
            cp -r admin/functions admin/dist/functions
          fi
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: admin
          command: pages deploy dist --project-name=fufut-admin --branch=main --commit-dirty=true --skip-caching

  build-pos:
    runs-on: ubuntu-latest
    needs: test-pos
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: pos/package-lock.json
      - run: cd pos && npm ci
      - run: |
          if [ -f pos/index.html.source ]; then
            cp pos/index.html.source pos/index.html
          fi
      - name: Build POS
        env:
          VITE_API_URL: ${{ vars.API_BASE_URL }}
        run: cd pos && npx vite build --base /
      - name: Bundle Pages Functions
        run: |
          if [ -d pos/functions ]; then
            cp -r pos/functions pos/dist/functions
          fi
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: pos
          command: pages deploy dist --project-name=fufut-pos --branch=main --commit-dirty=true --skip-caching
      - name: Commit built assets back
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rm -rf pos/assets
          cp -r pos/dist/assets pos/assets
          cp pos/dist/index.html pos/index.html.built
          cp pos/dist/index.html pos/index.html
          rm -rf pos/dist
          git add pos/index.html pos/index.html.built pos/assets/ || true
          git diff --cached --quiet || git commit -m "build: auto-build POS [skip ci]" --no-verify
          git push || true

  # Browser coverage for the table screens. It gates the deploy, and it passes.
  #
  # It spent a long time red for two reasons, neither of them the app's: the
  # route mock matched a glob wide enough to swallow the app's own client at
  # /backoffice/src/api/index.js and answer it with JSON, so the browser refused
  # the module and nothing ever rendered; and locally Playwright registered no
  # test at all when the project path was reached through a different letter
  # case than the filesystem's, which breaks its ESM module identity.
  #
  # Kept in its own job rather than inline with the deploy. A check that can
  # hang should not share a timeout with a deploy — when it did, the job was
  # cancelled and the build and deploy after it were silently skipped.
  e2e-backoffice:
    runs-on: ubuntu-latest
    # Comfortably clear of the steps inside it, so a slow run fails as a step
    # rather than being cancelled as a job — a cancelled job reports the whole
    # run as cancelled, which reads like nothing happened rather than like a
    # test that needs looking at. The browser install alone can take eight
    # minutes on a cold cache.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backoffice/package-lock.json
      - run: cd backoffice && npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('backoffice/package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-
      # NOT --with-deps. That runs apt-get, and apt is the entire cost here:
      # a run today spent twelve minutes retrying azure.archive.ubuntu.com
      # before timing out, in both jobs, having downloaded no browser at all.
      # The GitHub-hosted runner already carries Chromium's libraries; this
      # step now only fetches the browser, which the cache above usually makes
      # instant.
      #
      # If a library ever is missing, the E2E run fails naming it — a loud,
      # diagnosable failure rather than a quarter of an hour of apt retries.
      - name: Install Playwright browser
        run: cd backoffice && npx playwright install chromium
        timeout-minutes: 6
      - name: E2E Backoffice
        run: cd backoffice && npx playwright test --reporter=list
        timeout-minutes: 8

  build-backoffice:
    needs: e2e-backoffice
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backoffice/package-lock.json
      - run: cd backoffice && npm ci
      # Gates the deploy, exactly as test-pos gates build-pos. The backoffice
      # had no suite at all until the HR screens were added, which is how
      # AuditLogView shipped calling a 404 endpoint and rendering an empty table
      # that looked like a quiet day.
      - name: Test Backoffice
        run: cd backoffice && npm test
      - run: cp backoffice/index.html.source backoffice/index.html
      - name: Build Backoffice
        env:
          VITE_API_URL: ${{ vars.API_BASE_URL }}
        run: cd backoffice && npx vite build --base /
      - name: Bundle Pages Functions
        run: |
          if [ -d backoffice/functions ]; then
            cp -r backoffice/functions backoffice/dist/functions
          fi
      # 2026-08-26: every backoffice deploy since ~Aug 22 has been landing in a
      # PREVIEW deployment (main.fufut-backoffice.pages.dev) instead of
      # production, because this project's configured production branch is not
      # "main" (unlike fufut-pos and fufut-admin, where it is). Symptom:
      # wrangler printed "Deployment alias URL: .../main.fufut-backoffice..."
      # — the alias line only appears for non-production deployments — while
      # backoffice.fufutcoffee.com kept serving an older build. Deploying to
      # whatever branch the project actually treats as production fixes it
      # without hardcoding a name nobody can remember changing.
      - name: Read the Pages project's production branch
        run: |
          PROD_BRANCH=$(curl -sf -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects/fufut-backoffice" \
            | jq -r '.result.production_branch // empty')
          if [ -z "$PROD_BRANCH" ]; then
            echo "Could not read production_branch; falling back to 'production'"
            PROD_BRANCH=production
          fi
          echo "fufut-backoffice production branch: $PROD_BRANCH"
          echo "PROD_BRANCH=$PROD_BRANCH" >> "$GITHUB_ENV"
      # Plain run step rather than wrangler-action so $PROD_BRANCH is expanded
      # by a real shell; the action's command string is not guaranteed to go
      # through one.
      - name: Deploy Backoffice to the Pages production branch
        working-directory: backoffice
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name=fufut-backoffice --branch="$PROD_BRANCH" --commit-dirty=true --skip-caching
