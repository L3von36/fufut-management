name: Build POS Frontend

on:
  push:
    branches: [main]
    paths:
      - 'pos/src/**'
      - 'pos/index.html.source'
      - 'pos/vite.config.*'
      - 'pos/package.json'
      - 'pos/package-lock.json'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: pos/package-lock.json

      - name: Install dependencies
        run: cd pos && npm ci

      - name: Restore source index.html
        run: |
          if [ -f pos/index.html.source ]; then
            cp pos/index.html.source pos/index.html
          fi

      - name: Build POS
        run: cd pos && npx vite build --base /pos/

      - name: Deploy built files
        run: |
          # Remove old built assets
          rm -rf pos/assets
          # Copy new built assets from dist
          cp -r pos/dist/assets pos/assets
          cp pos/dist/index.html pos/index.html.built
          # Replace index.html with built version (server serves this)
          cp pos/dist/index.html pos/index.html
          # Clean up dist
          rm -rf pos/dist

      - name: Commit built assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pos/index.html pos/index.html.built pos/assets/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "build: auto-build POS frontend [skip ci]"
            git push
          fi